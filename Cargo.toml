[package]
name = "suprclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight replay-buffer screen clipper for Hyprland"
license = "MIT"
repository = "https://github.com/estridell/suprclip"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
